spring:
  application:
    name: modulo-pacientes
  cloud:
    config:
      profile: dev
  h2:
    console:
      enabled: true
eureka:
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka/
server:
  forward-headers-strategy: framework