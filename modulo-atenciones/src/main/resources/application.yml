spring:
  application:
    name: modulo-atenciones
  cloud:
      config:
        profile: prod
  h2:
    console:
      enabled: true
eureka:
  instance:
    # Fuerza a que se registren por IP, que es lo más estable en redes de Docker
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    service-url:
        defaultZone: http://eurekaserver:8761/eureka/
server:
  forward-headers-strategy: framework