services:
  eurekaserver:
      container_name: eurekaserver
      image: mrunixmaxi/modulo-eureka:1.0
      environment:
      - JAVA_OPTS=-XX:-UseContainerSupport
      restart: always
      ports:
      - "8761:8761"
      networks:
      - microservices
      hostname: eurekaserver

  configserver:
    container_name: configserver
    image: mrunixmaxi/configserver:1.0
    environment:
     - JAVA_OPTS=-XX:-UseContainerSupport
     - SPRING_PROFILES_ACTIVE=prod
    restart: always
    ports:
     - "8888:8888"
    depends_on:
     - eurekaserver
    networks:
     - microservices
    hostname: configserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  admin-service:
     container_name: adminservice
     image: mrunixmaxi/adminservice:1.0
     environment:
       - JAVA_OPTS=-XX:-UseContainerSupport
       - SPRING_APPLICATION_NAME=adminservice
       - SPRING_PROFILES_ACTIVE=prod
       - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
       - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
     restart: always
     ports:
       - "8084:8084"
     depends_on:
       eurekaserver:
         condition: service_started
       configserver:
         condition: service_healthy
     networks:
       - microservices
     hostname: adminservice

  gateway:
    container_name: gateway
    image: mrunixmaxi/modulo-gateway:1.0
    environment:
    - JAVA_OPTS=-XX:-UseContainerSupport
    - SPRING_APPLICATION_NAME=gateway
    - SPRING_PROFILES_ACTIVE=prod
    - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eurekaserver:8761/eureka/
    - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    restart: always
    ports:
    - "8080:8080"
    networks:
    - microservices
    hostname: gateway
    depends_on:
      eurekaserver:
        condition: service_started
      db:
        condition: service_started
      configserver:
        condition: service_healthy

  db:
   image: mysql:5.7
   container_name: hospitaldb
   command: --default-authentication-plugin=mysql_native_password
   restart: always
   environment:
     # Use these to automatically create the DB and root user
     MYSQL_ROOT_PASSWORD: admin
     MYSQL_DATABASE: hospitaldb
     MYSQL_PASSWORD: admin
     MYSQL_USER: admin
   ports:
     - "3306:3306"
   networks:
     - microservices
   volumes:
     - ./dump.sql:/docker-entrypoint-initdb.d/init.sql
     - mysql_data:/var/lib/mysql
   hostname: db

  atenciones:
    container_name: atenciones
    image: mrunixmaxi/modulo-atenciones:1.0
    environment:
    - JAVA_OPTS=-XX:-UseContainerSupport
    # 👇 AGREGADO: Forzamos el nombre de la app y la ruta del configserver en la red de Docker
    - SPRING_APPLICATION_NAME=modulo-atenciones
    - SPRING_PROFILES_ACTIVE=prod
    - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eurekaserver:8761/eureka/
    - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    restart: always
    ports:
    - "8082:8082"
    networks:
    - microservices
    hostname: atenciones
    depends_on:
      eurekaserver:
        condition: service_started
      db:
        condition: service_started
      configserver:
        condition: service_healthy

  pacientes:
    container_name: pacientes
    image: mrunixmaxi/modulo-pacientes:1.0
    environment:
    - JAVA_OPTS=-XX:-UseContainerSupport
    # 👇 AGREGADO: Forzamos el nombre de la app y la ruta del configserver en la red de Docker
    - SPRING_APPLICATION_NAME=modulo-pacientes
    - SPRING_PROFILES_ACTIVE=prod
    - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eurekaserver:8761/eureka/
    - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    restart: always
    ports:
    - "8081:8081"
    networks:
    - microservices
    hostname: pacientes
    depends_on:
      eurekaserver:
        condition: service_started
      db:
        condition: service_started
      configserver:
        condition: service_healthy

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: always
    environment:
     POSTGRES_DB: keycloak
     POSTGRES_USER: keycloak_user
     POSTGRES_PASSWORD: keycloak_password
    volumes:
    - keycloak_db_data:/var/lib/postgresql/data
    networks:
    - microservices

# 🔐 NUEVO: Servidor Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev
    restart: always
    environment:
     KC_BOOTSTRAP_ADMIN_USERNAME: admin
     KC_BOOTSTRAP_ADMIN_PASSWORD: admin_password
     KC_DB: postgres
     KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
     KC_DB_USERNAME: keycloak_user
     KC_DB_PASSWORD: keycloak_password
    ports:
     - "8180:8080"              # Mapeado al 8180 para evitar choque con el Gateway
    depends_on:
    - keycloak-db
    networks:
    - microservices
    hostname: keycloak


volumes:
  mysql_data:
  keycloak_db_data:
networks:
  microservices:
    driver: bridge